<style>
:root{
  --bg:#F1E6D4; --bg2:#EADCC6; --card:#F7F2EA; --card2:#FBF8F3;
  --ink:#1F1B17; --ink2:#5F564D; --ink3:#9A8E82; --line:#DCCFBC; --line2:#CDBEA8;
  --tc:#C4674A; --tc-d:#A8543A; --tc-s:#F2DDD2; --tc-t:#F4E3D8;
  --dark:#1E1C1A; --on-dark:#EDE3D3; --gold:#B8955A; --gold-s:#EFE3CD;
  --ok:#5F8A62; --ok-s:#E3EDE0; --ng:#B9573F; --ng-s:#F6E0D8;
  --c-sent:#7B8FA6; --c-part:#7F8F6E; --c-dem:#2F5B60; --c-adj:#6E6A40; --c-verb:#C4674A; --c-conj:#8B5A3C; --c-rev:#B8955A;
  --kr:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1916; --bg2:#24201C; --card:#27231F; --card2:#2D2824;
    --ink:#F1E6D4; --ink2:#C7BAA8; --ink3:#8C8175; --line:#3A342E; --line2:#4A423A;
    --tc:#DC8566; --tc-d:#B96A4E; --tc-s:#3E2A22; --tc-t:#33251F;
    --dark:#0F0E0D; --on-dark:#EDE3D3; --gold:#CDAA6E; --gold-s:#352D20;
    --ok:#86B68A; --ok-s:#233026; --ng:#E08A72; --ng-s:#3B2520;
    --c-sent:#9DB0C6; --c-part:#A3B38F; --c-dem:#79A8AD; --c-adj:#B3AE78; --c-verb:#DC8566; --c-conj:#C89371; --c-rev:#CDAA6E;
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1C1916; --bg2:#24201C; --card:#27231F; --card2:#2D2824;
    --ink:#F1E6D4; --ink2:#C7BAA8; --ink3:#8C8175; --line:#3A342E; --line2:#4A423A;
    --tc:#DC8566; --tc-d:#B96A4E; --tc-s:#3E2A22; --tc-t:#33251F;
    --dark:#0F0E0D; --on-dark:#EDE3D3; --gold:#CDAA6E; --gold-s:#352D20;
    --ok:#86B68A; --ok-s:#233026; --ng:#E08A72; --ng-s:#3B2520;
    --c-sent:#9DB0C6; --c-part:#A3B38F; --c-dem:#79A8AD; --c-adj:#B3AE78; --c-verb:#DC8566; --c-conj:#C89371; --c-rev:#CDAA6E;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--kr);line-height:1.6;-webkit-text-size-adjust:100%;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
ruby rt{font-size:.5em;color:var(--tc);font-weight:500;letter-spacing:.04em}
.nofuri rt{visibility:hidden}
.jp{font-family:var(--jp)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ---------- header (KOTO) ---------- */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.hdin{max-width:760px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:10px;background:var(--dark);display:grid;place-items:center;box-shadow:4px 4px 0 var(--line2);flex:0 0 46px}
.logo svg{width:26px;height:26px;color:var(--on-dark)}
.brand b{display:block;font:500 17px var(--kr);letter-spacing:.14em;line-height:1.15}
.brand small{display:block;font:400 11px var(--kr);letter-spacing:.34em;color:var(--tc);margin-top:2px}
.hr{margin-left:auto;display:flex;align-items:center;gap:12px}
.streak{display:flex;align-items:center;gap:6px;color:var(--tc);font-weight:600;font-size:14px;white-space:nowrap}
.streak svg{width:19px;height:19px}
.qbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:var(--ink2)}
.qbtn svg{width:22px;height:22px}

/* ---------- hero ---------- */
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--tc);font:500 12.5px var(--mono);letter-spacing:.22em;margin-top:44px}
.eyebrow i{width:20px;height:20px;border-radius:50%;background:var(--tc-s);display:grid;place-items:center;flex:0 0 20px}
.eyebrow i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc)}
.eyebrow::after{content:"";flex:0 0 56px;height:1px;background:var(--tc);opacity:.6}
.hero h1{margin:26px 0 0;font:700 clamp(36px,10.4vw,56px)/1.13 var(--kr);letter-spacing:-.045em}
.hero h1 span{display:block;color:var(--tc)}
.hero p{margin:24px 0 0;color:var(--ink2);font-size:15.5px;line-height:1.95;max-width:34em}
.ctas{display:flex;flex-direction:column;align-items:flex-start;gap:20px;margin-top:32px}
.bigbtn{display:inline-flex;align-items:center;gap:14px;background:var(--dark);color:var(--on-dark);padding:18px 30px;border-radius:8px;font-weight:600;font-size:16.5px;box-shadow:0 8px 0 var(--line2)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 5px 0 var(--line2)}
.bigbtn svg{width:18px;height:18px}
.tlink{display:inline-flex;align-items:center;gap:12px;font-weight:600;font-size:15.5px;border-bottom:1.5px solid var(--ink);padding-bottom:5px}
.tlink svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:48px}
.stats div{padding:2px 0 2px 16px;border-left:1px solid var(--line2)}
.stats div:first-child{border-left:0;padding-left:0}
.stats b{display:block;font:600 25px var(--kr);letter-spacing:-.03em}
.stats span{font-size:12.5px;color:var(--ink2)}

/* ---------- today ---------- */
.today-h{display:flex;justify-content:space-between;align-items:baseline;margin:52px 8px 12px;font:400 13px var(--mono);letter-spacing:.2em;color:var(--ink3)}
.today-h b{color:var(--tc);font-weight:500}
.tcard{position:relative;display:block;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:28px 22px 22px;overflow:hidden;box-shadow:12px 12px 0 -2px var(--bg2)}
.tcard::before{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:var(--tc-t)}
.tcard .num{position:relative;display:flex;align-items:flex-start;gap:18px}
.tcard .num b{white-space:nowrap;font:700 66px/.9 var(--kr);letter-spacing:-.06em;color:var(--tc)}
.tcard .num span{font:400 12.5px var(--mono);letter-spacing:.22em;color:var(--ink2);margin-top:14px;padding-right:44px;min-width:0}
.tcard .ico{position:absolute;right:22px;top:26px;color:var(--tc)}
.tcard .ico .gly{display:grid;place-items:center;width:48px;height:48px;border:1.5px solid var(--cc);border-radius:50%;font:500 22px var(--jp);color:var(--cc);background:var(--card2)}
.tcard .tt{position:relative;margin-top:22px;font:400 30px/1.4 var(--jp)}
.tcard .tsub{position:relative;margin-top:18px;background:var(--tc-t);border-radius:4px;padding:16px 18px;display:flex;gap:14px;align-items:center;font-size:14.5px;color:var(--ink)}
.tcard .tsub svg{flex:0 0 26px;width:26px;height:26px;color:var(--tc)}
.tcard .tsub b{color:var(--tc);font-weight:600;display:block}
.pbox{margin-top:14px;border:1.5px solid var(--line2);padding:14px 18px;font:500 14.5px var(--jp);color:var(--ink2)}
.pbox b{color:var(--tc);font-weight:600}
.prev2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.prev2>div{border:1.5px solid var(--line);background:var(--card2);padding:14px 16px;border-radius:4px}
.prev2 .lb{font-size:12.5px;color:var(--tc);font-weight:600}
.prev2 .j{font:400 16px/1.9 var(--jp)}
.prev2 .k{font-size:12px;color:var(--ink3)}

/* ---------- curriculum (KOTO) ---------- */
.sec{padding-top:72px}
.sec-eye{font:400 13px var(--mono);letter-spacing:.2em;color:var(--ink3)}
.sec-h{margin:18px 0 0;font:300 clamp(32px,9vw,46px)/1.2 var(--kr);letter-spacing:-.05em}
.sec-h em{font-style:normal;color:var(--tc);font-weight:500}
.prog{display:flex;align-items:center;gap:18px;justify-content:flex-end;margin-top:30px}
.prog svg{width:90px;height:90px}
.prog b{display:block;font-size:17.5px}
.prog span{font-size:13.5px;color:var(--ink2)}
.cur-h{display:flex;justify-content:space-between;align-items:center;margin-top:44px}
.cur-h span{font:400 13px var(--mono);letter-spacing:.2em;color:var(--ink2)}
.cur-h svg{width:26px;height:26px;color:var(--ink2)}
.search{margin-top:16px;display:flex;align-items:center;gap:12px;border:1.5px solid var(--line2);background:var(--card2);padding:14px 16px;border-radius:4px}
.search svg{width:22px;height:22px;color:var(--ink2);flex:0 0 22px}
.search input{border:0;background:transparent;outline:0;width:100%;font-size:16px}
.search input::placeholder{color:var(--ink3)}
.fchips{display:flex;flex-wrap:wrap;gap:6px 4px;margin-top:20px}
.fc{display:inline-flex;align-items:center;gap:10px;padding:11px 14px;border-radius:6px;font-size:16px;color:var(--ink2)}
.fc .fg{font:500 16px var(--jp)}
.fc small{font:400 13px var(--mono);color:var(--ink3)}
.fc[aria-pressed="true"]{background:var(--card2);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(60,40,20,.08)}
.fc[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--line2),0 1px 4px rgba(60,40,20,.08)}
.lcount{display:flex;justify-content:space-between;align-items:center;margin-top:36px}
.lcount p{margin:0;font-size:15px;color:var(--ink2)}
.lcount p b{color:var(--ink)}
.vbtn{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--line2);border-radius:4px;padding:10px 16px;font-size:14.5px;color:var(--ink2)}
.vbtn svg{width:20px;height:20px}
.wbtn{display:inline-flex;align-items:center;gap:6px;margin-right:8px;font-size:14px;font-weight:600;color:var(--tc)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.lc{position:relative;display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:20px 20px 16px;min-height:220px;overflow:hidden;width:100%}
.lc::before{content:"";position:absolute;right:-44px;top:-44px;width:130px;height:130px;border-radius:50%;background:var(--cc);opacity:.12}
.lc .top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.lc .n{font:500 32px/1 var(--mono);letter-spacing:-.05em;color:var(--cc)}
.lc .st{font:400 13px var(--mono);color:var(--ink3);margin-top:6px}
.lc .st.ok{font-family:var(--kr);color:var(--ink2);display:flex;align-items:center;gap:5px}
.lc .st.ok svg{width:15px;height:15px}
.lc .ic{display:flex;justify-content:center;margin:20px 0 22px;color:var(--cc)}
.lc .ic .gly{display:grid;place-items:center;width:52px;height:52px;border:1.5px solid var(--cc);border-radius:50%;font:500 24px var(--jp);color:var(--cc);background:var(--card2)}
.lc .tag{font:400 11.5px var(--mono);letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .tg{font:400 19px/1.45 var(--jp);margin-top:8px}
.lc .sb{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:6px;font-size:13px;color:var(--ink2)}
.lc .sb svg{width:22px;height:22px;color:var(--gold);flex:0 0 22px}
.lc.sel{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc)}
.rows{margin-top:22px;border:1.5px solid var(--line);background:var(--card)}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;padding:13px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{font:500 17px var(--mono);color:var(--cc)}
.row .t{font:400 16.5px var(--jp);display:block}
.row .s{font-size:12.5px;color:var(--ink3)}
.row .ck{font-size:13px;color:var(--ok);white-space:nowrap}
.row.sel{background:var(--tc-t)}

/* ---------- lesson (KOTO) ---------- */
.lesson{margin-top:72px;border-top:1.5px solid var(--line2);padding-top:40px}
.lmeta{margin-top:40px;font:400 14px var(--mono);letter-spacing:.2em;color:var(--ink2)}
.lmeta2{margin-top:14px;font:400 13px var(--mono);letter-spacing:.16em;color:var(--ink2)}
.lsub{margin-top:44px;font:500 14px var(--jp);letter-spacing:.16em;color:var(--tc)}
.ltitle{margin:18px 0 0;font:300 clamp(38px,11vw,56px)/1.2 var(--jp);letter-spacing:-.02em}
.lbar{display:flex;align-items:center;gap:10px;margin-top:30px;flex-wrap:wrap}
.donebtn{display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border:1.5px solid var(--line2);border-radius:4px;font-weight:600;font-size:15px}
.donebtn svg{width:20px;height:20px}
.donebtn[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:#fff}
.furi{display:inline-flex;align-items:center;gap:6px;padding:14px 14px;border:1.5px solid var(--line2);border-radius:4px;font:500 14px var(--jp);color:var(--ink2)}
.furi[aria-pressed="false"]{opacity:.55}
.ldesc{margin-top:26px;color:var(--ink2);font-size:15.5px;line-height:1.85}
.build{position:relative;margin-top:30px;background:var(--dark);color:var(--on-dark);border-radius:4px;padding:30px 24px 28px;overflow:hidden}
.build::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;border:34px solid rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 0 0 1px rgba(255,255,255,.06)}
.build .h{display:flex;justify-content:space-between;font:500 13px var(--mono);letter-spacing:.2em;color:#CDB78C;position:relative}
.build .h span:last-child{color:#8E877E}
.build .p{position:relative;margin-top:26px;font:400 22px/1.55 var(--jp)}
.build .bar{position:relative;margin-top:24px;width:56px;height:4px;border-radius:2px;background:var(--cc)}
.shd{display:flex;justify-content:space-between;align-items:baseline;margin-top:44px}
.shd h2{margin:0;font:700 21px var(--kr);letter-spacing:-.02em}
.shd span{font:500 12.5px var(--mono);letter-spacing:.2em;color:var(--ink2)}
.shd.line{padding-bottom:16px;border-bottom:1px solid var(--line2)}
.tbl{overflow-x:auto;margin-top:18px;border:1.5px solid var(--line);background:var(--card);border-radius:4px}
table{border-collapse:collapse;width:100%}
th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:14.5px}
th{font:500 12px var(--kr);color:var(--ink3);background:var(--card2)}
td{font-family:var(--jp)}
tr:last-child td{border-bottom:0}
.kp{display:flex;flex-direction:column;gap:16px;margin-top:22px}
.kc{display:grid;grid-template-columns:48px 1fr;gap:6px;align-items:start;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:20px 18px 18px}
.kc .i{font:500 16px var(--mono);color:var(--tc);padding-top:16px}
.kc .j{font:400 22px/1.95 var(--jp);display:block}
.kc .k{font-size:14.5px;color:var(--ink2);margin-top:4px;display:block}
.ra{margin-top:18px;border-top:1px solid var(--line2)}
.ri{display:block;width:100%;padding:22px 0;border-bottom:1px solid var(--line2)}
.ri .lb{font-size:13px;color:var(--tc);font-weight:500}
.ri .j{font:400 22px/1.95 var(--jp);display:block;margin-top:4px}
.ri .k{font-size:14.5px;color:var(--ink2);display:block}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.vc{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:14px 16px;min-height:80px}
.vc .w{font:700 19px/1.95 var(--jp)}
.vc .m{font-size:13.5px;color:var(--ink2);text-align:right}
.box{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:26px 24px}
.box .bh{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line2)}
.box .bh.nb{border-bottom:0;padding-bottom:0}
.box .bh h3{margin:0;font:700 18px var(--kr)}
.box .bh span{font:500 12.5px var(--mono);letter-spacing:.2em;color:var(--ink2)}
.box .bh svg{width:28px;height:28px;color:var(--tc)}
.wl{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:16px}
.wl li{display:flex;gap:14px;align-items:center;font-size:16px;color:var(--ink2)}
.wl li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc);flex:0 0 8px}
.bx-p{margin:16px 0 0;font-size:14px;color:var(--ink3)}
.dl{display:flex;flex-direction:column;gap:22px;margin-top:22px}
.dr{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}

const RB=/\{([^|}]+)\|([^}]+)\}/g;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function rb(s){return esc(s).replace(RB,'<ruby>$1<rt>$2</rt></ruby>');}
function plain(s){return String(s).replace(RB,"$1");}
function kana(s){return String(s).replace(RB,"$2").replace(/→/g,"、").replace(/[～＿\[\]]/g,"");}
function pad(n){return String(n).padStart(2,"0");}
function $(id){return document.getElementById(id);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800);}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function firstSent(s){const i=s.indexOf(". ");return i>0?s.slice(0,i+1):s;}

   +(d!=="W"?'<div class="lbar"><button class="donebtn" data-a="done" data-d="'+d+'" aria-pressed="'+dn+'">'+(dn?SVG.check+'학습 완료':'완료 표시 '+SVG.check)+'</button></div>':'')
   +'<p class="ldesc">'+(d==="W"?"레슨 퀴즈에서 틀린 문제입니다. 여기서 맞히면 목록에서 빠집니다. 한 번에 최대 15문제.":d===100?"100일 전체에서 무작위로 20문제를 냅니다. 틀린 문제는 DAY 번호의 레슨으로 돌아가 HOW TO BUILD와 핵심 표현을 다시 읽으세요.":"이번 구간 문형을 한 번 훑고 퀴즈 12문제를 풉니다. 틀린 문제는 레슨으로 돌아가 다시 확인하세요.")+'</p>';
  if(lessons.length&&d!==100)h+='<div class="shd"><h2>이번 구간 문형</h2><span>'+lessons.length+' PATTERNS</span></div><div class="rl">'+lessons.map(l=>'<button data-a="open" data-d="'+l.d+'" style="--cc:'+ccol(l.cat)+'"><span class="n">'+pad(l.d)+'</span><span><span class="t">'+rb(l.t)+'</span><span class="s">'+esc(l.pat)+'</span></span><span class="ck">'+(S.done[l.d]?"✓":"")+'</span></button>').join("")+'</div>';
  if(!ids.length)return h+'<p class="ldesc">틀린 문제가 없습니다.</p>'+pnHTML(d);
  h+='<div class="shd"><h2>'+(d==="W"?"오답 퀴즈":"복습 퀴즈")+'</h2><span>'+ids.length+' QUESTIONS</span></div><div class="qz">'+ids.map((id,i)=>quizCard(id,findQ(id),'Q'+(i+1)+' · DAY '+pad(+baseId(id).split("-")[0]))).join("")+'</div>'+scoreLine(ids)
   +'<div class="dctl"><button class="sbtn" data-a="reroll">새 문제로 다시</button></div>';
  return h+pnHTML(d);
}

/* ---------------- glossary ---------------- */
function glItems(){let it=GL;if(V.gcat!=="전체")it=it.filter(g=>g.c===V.gcat);if(V.gq){const q=V.gq.toLowerCase();it=it.filter(g=>(plain(g.w)+" "+kana(g.w)+" "+g.m+" "+g.d).toLowerCase().includes(q));}return it;}
function glHTML(){
  const it=glItems();
  return '<div class="sec-eye">THEMATIC GLOSSARY</div><h2 class="sec-h">단어장 <em>·</em> '+GL.length+' unique</h2>'
   +'<p class="ldesc">100일 레슨의 학습 단어 540개 가운데 겹치지 않는 표제어 '+GL.length+'개를 주제별로 모았습니다. 카드를 누르면 해당 레슨으로 이동합니다.</p>'
   +'<label class="gsearch">'+SVG.search+'<input id="gq" type="search" placeholder="일본어 · 한국어 · 레슨 검색" value="'+esc(V.gq)+'"></label>'
   +'<div id="glbody">'+glBody(it)+'</div>';
}
function glBody(it){
  return '<div class="gcnt"><b>'+it.length+'</b> / '+GL.length+'</div>'
   +'<div class="pills">'+[["전체",GL.length]].concat(GCATS).map(c=>'<button class="pill" data-a="gcat" data-c="'+c[0]+'" aria-pressed="'+(V.gcat===c[0])+'">'+c[0]+'<small>'+c[1]+'</small></button>').join("")+'</div>'
   +'<div class="gcards">'+it.slice(0,V.glim).map(g=>'<div class="gc"><div class="h"><span>'+esc(g.c)+'</span><span>DAY '+pad(g.d)+'</span></div><button class="w" data-a="say" data-t="'+esc(g.w)+'">'+rb(g.w)+'</button><div class="m">'+esc(g.m)+'</div><button class="f" data-a="open" data-d="'+g.d+'">'+(g.n>1?g.n+'회 등장':'레슨 '+g.d)+'</button></div>').join("")+'</div>'
   +(it.length>V.glim?'<button class="more" data-a="more">더 보기 ('+(it.length-V.glim)+'개 남음)</button>':'');
}

/* ---------------- render ---------------- */
function renderAll(){chrome();$("hero").innerHTML=heroHTML();$("today").innerHTML=todayHTML();$("curriculum").innerHTML=curHTML();$("lesson").innerHTML=lessonHTML(V.d);$("glossary").innerHTML=glHTML();}
function refreshTop(){chrome();$("hero").innerHTML=heroHTML();$("today").innerHTML=todayHTML();}
function refreshCur(keepInput){
  if(keepInput){const cw=$("cardwrap");if(cw)cw.innerHTML=cardsHTML();const lc=document.querySelector(".lcount p");if(lc)lc.innerHTML='<b>'+curItems().length+'</b>개의 문형 · 하루 15분';return;}
  $("curriculum").innerHTML=curHTML();
}
function open(d){
  if(d!=="W"&&(d<1||d>100))return;
  V.d=d;V.hideB=false;V.shown={};RQ=null;
  $("lesson").innerHTML=lessonHTML(d);refreshCur(false);
  requestAnimationFrame(()=>$("lesson").scrollIntoView({behavior:"smooth",block:"start"}));
}
function markDone(d,on){if(on)S.done[d]=iso(new Date());else delete S.done[d];save();}
function openHelp(){
  const dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  $("shin").innerHTML='<h3>하루 15분 사용법</h3><ol><li>HOW TO BUILD로 문장 구조 보기 (2분)</li><li>핵심 표현·예문을 눌러 듣고 따라 읽기 (4분)</li><li>오늘의 단어 6개 소리 내어 읽기 (3분)</li><li>대화를 A·B 바꿔 읽기, 「B 가리기」로 말하기 연습 (3분)</li><li>확인 퀴즈 3문제 → 완료 표시 (3분)</li></ol>'
   +'<div style="height:10px"></div>'
   +'<div class="srow"><div>후리가나<small>한자 위 읽기 표시</small></div><button class="sbtn" data-a="furi" aria-pressed="'+S.furi+'">'+(S.furi?"켜짐":"꺼짐")+'</button></div>'
   +'<div class="srow"><div>다크 모드</div><button class="sbtn" data-a="theme" aria-pressed="'+dark+'">'+(dark?"켜짐":"꺼짐")+'</button></div>'
   +'<div class="srow"><div>진도 초기화<small>완료 '+doneCount()+'개 · 오답 '+Object.keys(S.wrong).length+'개 삭제</small></div><button class="sbtn" data-a="reset">초기화</button></div>'
   +'<button class="more" data-a="sheetclose">닫기</button>';
  $("sheet").hidden=false;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a;
  if(a==="sheetbg"){if(e.target===b)$("sheet").hidden=true;return;}
  if(a==="sheetclose"){$("sheet").hidden=true;return;}
  if(a==="help")return openHelp();
  if(a==="open"){const d=b.dataset.d;return open(d==="W"?"W":+d);}
  if(a==="scroll"){$(b.dataset.t).scrollIntoView({behavior:"smooth",block:"start"});return;}
  if(a==="furi"){S.furi=!S.furi;save();chrome();document.querySelectorAll('[data-a="furi"]').forEach(x=>{x.setAttribute("aria-pressed",S.furi);if(x.classList.contains("sbtn"))x.textContent=S.furi?"켜짐":"꺼짐";});return;}
  if(a==="theme"){const dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;S.theme=dark?"light":"dark";save();chrome();openHelp();return;}
  if(a==="reset"){if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="한 번 더 누르면 삭제";return;}S.done={};S.wrong={};save();QS={};$("sheet").hidden=true;V.d=1;renderAll();toast("진도를 초기화했습니다");return;}
  if(a==="cat"){V.cat=b.dataset.c;refreshCur(false);return;}
  if(a==="view"){S.view=S.view==="grid"?"list":"grid";save();refreshCur(false);return;}
  if(a==="gcat"){V.gcat=b.dataset.c;V.glim=40;$("glbody").innerHTML=glBody(glItems());return;}
  if(a==="more"){V.glim+=40;$("glbody").innerHTML=glBody(glItems());return;}
  if(a==="say"){speak(b.dataset.t);return;}
  if(a==="sayall"){speak(info(V.d).dlg.map(l=>l[1]));return;}
  if(a==="hideB"){V.hideB=!V.hideB;V.shown={};$("lesson").innerHTML=lessonHTML(V.d);return;}
  if(a==="reveal"){V.shown[+b.dataset.i]=1;b.closest(".dr").classList.remove("hide");b.dataset.a="say";speak(b.dataset.t);return;}
  if(a==="done"){const d=+b.dataset.d;markDone(d,!S.done[d]);b.setAttribute("aria-pressed",!!S.done[d]);b.innerHTML=S.done[d]?SVG.check+'학습 완료':'완료 표시 '+SVG.check;refreshTop();refreshCur(false);toast(S.done[d]?"DAY "+pad(d)+" 완료 · 연속 "+streak()+"일":"완료 표시를 해제했습니다");return;}
  if(a==="pick"){
    const id=b.dataset.id,oi=+b.dataset.o;if(QS[id]!==undefined)return;
    QS[id]=oi;const bid=baseId(id),q=findQ(id);
    if(oi===0){if(id.startsWith("W|"))delete S.wrong[bid];}else S.wrong[bid]=(S.wrong[bid]||0)+1;
    save();
    const card=b.closest(".qc"),tmp=document.createElement("div");tmp.innerHTML=quizCard(id,q,card.dataset.tag);card.replaceWith(tmp.firstElementChild);
    const sc=$("score");if(sc){const t2=document.createElement("div");t2.innerHTML=scoreLine(sc.dataset.ids.split(","));sc.replaceWith(t2.firstElementChild);}
    if(oi===0&&/[ぁ-んァ-ン一-龥]/.test(plain(q.o[0])))speak(q.q.includes("＿")?q.q.replace(/＿/g,q.o[0]):q.o[0]);
    const w=Object.keys(S.wrong).length;const lcs=document.querySelector(".lcount span");if(lcs&&!V.q)refreshCur(false);
    return;
  }
  if(a==="reroll"){RQ=null;Object.keys(QS).forEach(k=>{if(k.startsWith("R|")||k.startsWith("W|")||k.startsWith("oR|")||k.startsWith("oW|"))delete QS[k];});$("lesson").innerHTML=lessonHTML(V.d);return;}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){V.q=e.target.value;refreshCur(true);}
  if(e.target.id==="gq"){V.gq=e.target.value;V.glim=40;$("glbody").innerHTML=glBody(glItems());}
});
renderAll();
</script>

</body>
</html>
