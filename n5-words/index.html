<!DOCTYPE html>
<html lang="ko" data-pal="t26d">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="N5 단어">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" href="icon-512.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<title>일본어 N5 단어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: phone-width column; home = dashboard cards, test = step flow (particle → verb → breakdown); fixed bottom tab bar. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --ink:#161B2E; --muted:#646B80; --line:#E2E5EC; --soft:#EEF0FC;
  --accent:#3346C8; --accent-ink:#FFFFFF; --hero:#161B2E; --hero-ink:#FFFFFF; --hero-muted:#A9B0C6;
  --good:#1F9D6B; --good-soft:#E3F5EC; --good-ink:#136B48;
  --bad:#D9483B; --bad-soft:#FDECEA; --bad-ink:#A8322A;
  --warn:#F2B23A; --empty:#E7E9F2; --lv3:#1F9D6B; --lv2:#F2B23A; --lvbad:#D9483B; --pic:#FDFBF3; --streak:#FFF1E8; --streak-ink:#C2410C;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131C; --surface:#171C28; --ink:#E9ECF3; --muted:#9AA2B4; --line:#283042; --soft:#1E2747;
  --accent:#8EA2F5; --accent-ink:#0F131C; --hero:#222A40; --hero-ink:#FFFFFF; --hero-muted:#AAB3CC;
  --good:#5BC495; --good-soft:#163428; --good-ink:#7FD9AF;
  --bad:#F07A6E; --bad-soft:#3A1E1B; --bad-ink:#F5A097;
  --warn:#E5B04C; --empty:#283042; --pic:#FDFBF3; --streak:#3A2418; --streak-ink:#FFB088; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131C; --surface:#171C28; --ink:#E9ECF3; --muted:#9AA2B4; --line:#283042; --soft:#1E2747;
  --accent:#8EA2F5; --accent-ink:#0F131C; --hero:#222A40; --hero-ink:#FFFFFF; --hero-muted:#AAB3CC;
  --good:#5BC495; --good-soft:#163428; --good-ink:#7FD9AF;
  --bad:#F07A6E; --bad-soft:#3A1E1B; --bad-ink:#F5A097;
  --warn:#E5B04C; --empty:#283042; --pic:#FDFBF3; --streak:#3A2418; --streak-ink:#FFB088; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.jp{font-family:var(--f-jp)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.pad{padding:14px}
.lbl{font-size:12px;color:var(--muted)}
.h-title{font-size:22px;font-weight:700;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:14px;height:50px;padding:0 18px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.dark{background:var(--ink);color:var(--bg)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--soft);font-weight:700}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}

/* home */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.streak{display:flex;align-items:center;gap:5px;background:var(--streak);color:var(--streak-ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.goal{display:flex;gap:16px;align-items:center}
.ring{width:84px;height:84px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.ring>div{width:66px;height:66px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:21px;line-height:1}
.ring span{font-size:11px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:11px;color:var(--muted)}
.week div{display:flex;flex-direction:column;align-items:center;gap:3px}
.week i{width:18px;height:18px;border-radius:50%;background:var(--empty);display:block}
.week i.on{background:var(--accent)}
.week i.today{background:transparent;border:2px dashed var(--accent)}
.week .t{color:var(--ink);font-weight:700}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;border:0}
.hero img{width:72px;height:56px;object-fit:cover;object-position:top;border-radius:10px;background:var(--pic);flex:none}
.hero .s{font-size:12px;color:var(--hero-muted)}
.hero .b{font-size:17px;font-weight:700}
.hero .btn{background:var(--accent);color:var(--accent-ink);height:44px;margin-left:auto}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.map{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:10px}
.map button{aspect-ratio:1;border:0;border-radius:4px;padding:0;background:var(--empty)}
.map .s2{background:var(--lv3)} .map .s1{background:var(--lv2)} .map .s3{background:var(--lvbad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:block}
.weak{display:flex;gap:8px;flex-wrap:wrap}
.weak button{border:0;background:var(--bad-soft);color:var(--bad-ink);border-radius:10px;padding:6px 10px;font-family:var(--f-jp);font-size:17px;font-weight:700}
.weak button small{font-family:var(--f-ui);font-size:12px;font-weight:500;margin-left:4px}

/* test */
.qtop{display:flex;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;margin-left:-10px;border-radius:12px;color:var(--muted)}
.segs{flex-grow:1;display:grid;gap:3px}
.segs i{height:6px;border-radius:3px;background:var(--empty);display:block}
.segs i.ok{background:var(--good)} .segs i.no{background:var(--bad)} .segs i.cur{background:var(--accent)}
.qcount{font-size:13px;color:var(--muted);min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.steps{display:flex;align-items:center;gap:6px}
.step{display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px 5px 6px;font-size:13px;background:var(--empty);color:var(--muted);white-space:nowrap}
.step i{width:18px;height:18px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;font-style:normal}
.step.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.step.on i{color:var(--accent)}
.step.ok{background:var(--good-soft);color:var(--good-ink);font-weight:700}
.step.no{background:var(--bad-soft);color:var(--bad-ink);font-weight:700}
.steps hr{flex-grow:1;border:0;height:2px;background:var(--line);margin:0;min-width:8px}
.picbox{background:var(--pic);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.picbox img{display:block;width:100%;height:auto;max-height:240px;object-fit:contain}
.sent{padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sline{font-family:var(--f-jp);font-size:26px;font-weight:700;line-height:1.6;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:44px;padding:0 8px;border-radius:10px;border:2.5px dashed var(--line);background:var(--bg);color:var(--muted);font-size:22px;margin:0 2px}
.blank.cur{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.blank.ok{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good-ink)}
.blank.no{border-style:solid;border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.blank.wide{min-width:110px}
.blank s{opacity:.55;font-size:15px;margin-right:6px}
.ko{font-size:15px;color:var(--muted)}
.kana{font-family:var(--f-jp);font-size:13px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.popt{height:66px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.popt b{font-family:var(--f-jp);font-size:26px;line-height:1.1}
.popt small{font-size:11px;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vopt{position:relative;min-height:70px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px}
.vopt b{font-family:var(--f-jp);font-size:23px;line-height:1.2;overflow-wrap:anywhere}
.vopt small{font-family:var(--f-jp);font-size:12px;color:var(--muted)}
.vopt .n,.popt .n{position:absolute;top:5px;left:8px;font-size:11px;color:var(--muted);font-family:var(--f-ui)}
.popt{position:relative}
.popt:not(:disabled):hover,.vopt:not(:disabled):hover{border-color:var(--accent)}
.right{border-color:var(--good)!important;background:var(--good-soft)!important;color:var(--good-ink)}
.wrong{border-color:var(--bad)!important;background:var(--bad-soft)!important;color:var(--bad-ink)}
.dim{opacity:.45}
button:disabled{cursor:default}

.result{border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:0 -6px 24px rgba(22,27,46,.08);padding:16px;display:flex;flex-direction:column;gap:12px}
.verdict{align-self:flex-start;font-size:13px;font-weight:700;border-radius:999px;padding:4px 11px}
.verdict.ok{background:var(--good-soft);color:var(--good-ink)}
.verdict.no{background:var(--bad-soft);color:var(--bad-ink)}
.vhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.vhead .w{font-family:var(--f-jp);font-size:40px;font-weight:700;line-height:1}
.vhead .r{font-family:var(--f-jp);font-size:15px;color:var(--muted)}
.vhead .m{margin-left:auto;font-size:18px;font-weight:700}
.forms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.forms div{background:var(--surface);padding:8px 4px;text-align:center;min-width:0}
.forms .k{font-size:11px;color:var(--muted)}
.forms .v{font-family:var(--f-jp);font-size:16px;font-weight:700;overflow-wrap:anywhere}
.forms .vk{font-family:var(--f-jp);font-size:11px;color:var(--muted)}
.full .s{font-family:var(--f-jp);font-size:20px;font-weight:700}
.full .s em{font-style:normal;color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.build{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.build span{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-family:var(--f-jp);font-size:17px;font-weight:700}
.build span.last{background:var(--good-soft);border-color:var(--good);color:var(--good-ink)}
.build svg{color:var(--muted)}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px}
.tip svg{flex:none;margin-top:2px;color:var(--accent)}
.tip .jp{font-size:14px}
.rbtns{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.rbtns .btn{white-space:nowrap;padding:0 10px}
.score{font-size:46px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.mist{display:grid;gap:6px}
.mist button{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;text-align:left}
.mist img{width:52px;height:40px;object-fit:cover;object-position:top;border-radius:6px;background:var(--pic);flex:none}
.mist .jp{font-size:19px;font-weight:700}
.mist .tag{margin-left:auto;font-size:11px;border-radius:6px;padding:2px 7px;background:var(--bad-soft);color:var(--bad-ink);white-space:nowrap}

/* list & pairs */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column}
.tile .ti{background:var(--pic);aspect-ratio:4/3;max-width:100%;overflow:hidden}
.tile .ti img{width:100%;height:100%;object-fit:cover;object-position:top}
.tile .tt{padding:7px 9px 9px;min-width:0}
.tile .tw{font-family:var(--f-jp);font-weight:700;font-size:20px;display:flex;align-items:center;gap:6px}
.tile .tm{font-size:12px;color:var(--muted);line-height:1.35}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--empty)}
.dot.s1{background:var(--lv2)} .dot.s2{background:var(--lv3)} .dot.s3{background:var(--lvbad)}
.num{font-size:11px;color:var(--muted);margin-left:auto;font-family:var(--f-ui);font-variant-numeric:tabular-nums}
.pair .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .side{border:0;background:transparent;padding:0;text-align:center;min-width:0}
.pair .side img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;border-radius:12px;background:var(--pic)}
.pair .w{font-family:var(--f-jp);font-weight:700;font-size:23px;margin-top:4px}
.pair .m{font-size:12px;color:var(--muted)}
.pair p{margin:10px 0 0;font-size:14px}
.pair p .jp{font-size:16px}
.empty{color:var(--muted);text-align:center;padding:30px 0}

/* detail sheet */
[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,14,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .close{position:sticky;top:0;z-index:1;display:flex;justify-content:flex-end;padding:10px}
.sheet .close button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px}
.sheet .pic{background:var(--pic);margin-top:-52px}
.sheet .pic img{display:block;width:100%;height:auto}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--soft);color:var(--accent);font-weight:700}
.badge.exc{background:var(--bad-soft);color:var(--bad-ink)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabbar button{border:0;background:transparent;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;border-radius:12px}
.tabbar button[aria-selected="true"]{color:var(--accent);font-weight:700}
.foot{margin-top:22px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.foot button{border:0;background:transparent;color:var(--muted);text-decoration:underline;padding:0;font-size:12px}
.confirm{margin-top:10px;background:var(--bad-soft);color:var(--bad-ink);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.confirm button{border:0;border-radius:8px;padding:6px 12px;font-size:13px}
.confirm .y{background:var(--bad);color:#fff}
.confirm .n{background:var(--surface);color:var(--ink)}
.fade{animation:fade .2s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;color:inherit;font:inherit}
.lesson.next{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.lesson .ln{flex:none;width:34px;height:34px;border-radius:50%;background:var(--empty);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.lesson.next .ln{background:var(--accent);color:#fff}.lesson .ln.done{background:var(--lv3);color:#fff}
.lesson .lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.lesson .lt small{color:var(--muted);font-size:12px}
.lesson .lc{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--empty)}.lbar i{display:block;height:100%}
.hles{display:flex;align-items:center;gap:12px}.hles .lt{flex:1;min-width:0}
/* home v2 */
.nles{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:6px}
.nl-top{display:flex;justify-content:space-between}.nl-k{font-size:12px;color:var(--hero-muted);font-variant-numeric:tabular-nums}
.nl-t{font-size:24px;font-weight:700;line-height:1.25}.nl-d{font-size:13px;color:var(--hero-muted)}
.nl-pics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.nl-pics div{display:flex;flex-direction:column;gap:4px;min-width:0}
.nl-pics img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--pic);display:block}
.nl-pics span{font-size:13px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nl-bar{margin-top:8px}.nl-bar .lbar{background:var(--hero-track,rgba(255,255,255,.16))}
.nl-btns{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:8px;margin-top:8px}
.nl-btns .btn{padding:0 10px}.nles .btn{background:var(--btn,var(--accent));color:var(--btn-ink,var(--accent-ink))}
.nles .btn.nl-ghost{background:var(--hero-ghost,rgba(255,255,255,.12));color:var(--hero-ink)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.dcard .big{font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}.dcard .big small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.dcard .btn:not(.ghost){background:var(--btn,var(--accent));color:var(--btn-ink,var(--accent-ink))}
.duo .dcard:first-child{background:var(--c-rev,var(--surface))}.duo .dcard:last-child{background:var(--c-goal,var(--surface))}.duo .dcard:last-child .ring>div{background:var(--c-goal,var(--surface))}
.wcard{background:var(--c-week,var(--surface))}
.dcard .btn{width:100%;height:42px;margin-top:auto;font-size:14px;padding:0 8px}
.ring.sm{width:66px;height:66px}.ring.sm>div{width:52px;height:52px}.ring.sm b{font-size:18px}

const IMAP={"う":"い","く":"き","ぐ":"ぎ","す":"し","つ":"ち","ぬ":"に","ぶ":"び","む":"み","る":"り"};
const AMAP={"う":"わ","く":"か","ぐ":"が","す":"さ","つ":"た","ぬ":"な","ぶ":"ば","む":"ま","る":"ら"};
const TEMAP={"う":"って","つ":"って","る":"って","む":"んで","ぶ":"んで","ぬ":"んで","く":"いて","ぐ":"いで","す":"して"};
function stem(s,v){ if(v.g===3){ if(s==="来る")return "来"; if(s==="くる")return "き"; return s.slice(0,-2)+"し"; } if(v.g===2) return s.slice(0,-1); return s.slice(0,-1)+IMAP[s.slice(-1)]; }
function te(s,v){ if(v.g===3){ if(s==="来る")return "来て"; if(s==="くる")return "きて"; return s.slice(0,-2)+"して"; } if(v.g===2) return s.slice(0,-1)+"て"; if(v.id===6) return s.slice(0,-1)+"って"; return s.slice(0,-1)+TEMAP[s.slice(-1)]; }
function nai(s,v){ if(v.g===3){ if(s==="来る")return "来ない"; if(s==="くる")return "こない"; return s.slice(0,-2)+"しない"; } if(v.g===2) return s.slice(0,-1)+"ない"; if(v.id===3) return "ない"; return s.slice(0,-1)+AMAP[s.slice(-1)]+"ない"; }
const SUF={m:"ます",mt:"ました",tai:"たい"};
function form(v,f,kana){ if(v.k!=="v") return kana?v.r:v.w; const s=kana?v.r:v.w; if(f==="d") return s; if(f==="ti") return te(s,v)+"います"; return stem(s,v)+SUF[f]; }
const FNAME={d:"사전형",m:"ます형 (정중·현재)",mt:"ました (정중·과거)",ti:"ています (진행·상태)",tai:"たい (~하고 싶다)"};
function buildSteps(v,f){
  if(f==="d") return [v.w];
  if(f==="ti") return [v.w, te(v.w,v), te(v.w,v)+"います"];
  return [v.w, stem(v.w,v), stem(v.w,v)+SUF[f]];
}
function ruleText(v,f){
  if(f==="d") return "사전형 그대로";
  if(v.g===3) return "불규칙 동사: する→し, 来る→き";
  if(f==="ti"){ return v.g===2?"る를 떼고 て + います":"て형(1그룹 음편) + います"; }
  if(v.g===2) return "る를 떼고 + "+SUF[f];
  const last=v.w.slice(-1); return last+" → "+IMAP[last]+" (う단 → い단) + "+SUF[f];
}

  el.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>pickV(+b.dataset.v));
  if(step===3) renderNounResult(q,v,aOK,fOK);
}
function renderNounResult(q,v,aOK,fOK){
  const kanaOnly=v.w===v.r, what=kanaOnly?"표기":"읽기";
  let verdict,cls;
  if(aOK&&fOK){verdict="정답입니다";cls="ok";} else if(!aOK&&!fOK){verdict=`${v.lab}와 ${what} 모두 틀렸어요`;cls="no";} else if(!aOK){verdict=`${v.lab}${v.lab==="표현"?"이":"가"} 틀렸어요`;cls="no";} else {verdict=`${what}가 틀렸어요`;cls="no";}
  const ch=q.v!==null?q.fo[q.v]:null;
  const wrongR = ch&&ch!==v.r ? `<div class="tip">${ICON_INFO}<span><b class="jp">${ch}</b>가 아니라 <b class="jp">${v.r}</b>. ${TRAPWHY[q.fc[ch]]||""}</span></div>` : "";
  const full=`<div class="full stack" style="gap:2px"><div class="s">${sentenceFull(v,true)}</div><div class="lbl">${esc(v.s[2])}</div></div>`;
  const badge=`<div class="badges"><span class="badge">${NTOPICS[v.tp]}</span></div>`;
  const note=v.note?`<div class="tip">${ICON_INFO}<span>${jpWrap(v.note)}</span></div>`:"";
  resultShell(v,verdict,cls,badge+full+wrongR+note);
}

function renderAdjResult(q,v,aOK,fOK){
  const t=v.s[1];
  let verdict,cls;
  if(aOK&&fOK){verdict="정답입니다";cls="ok";} else if(!aOK&&!fOK){verdict="형용사와 형태 모두 틀렸어요";cls="no";} else if(!aOK){verdict="형용사가 틀렸어요";cls="no";} else {verdict="형태가 틀렸어요";cls="no";}
  const wrongX = q.v!==null&&q.fo[q.v][0]==="x" ? `<div class="tip">${ICON_INFO}<span><b class="jp">${aForms(v)[q.fo[q.v]]}</b>는 틀린 형태입니다. ${v.t==="na"?"な형용사는 い를 활용하지 않습니다.":(v.id===1041?"いい의 과거·부정은 よ로 만듭니다.":"い형용사의 과거는 ～かったです (～いでした ✗).")}</span></div>` : "";
  const full=`<div class="full stack" style="gap:2px"><div class="s">${sentenceFull(v,true)}</div><div class="lbl">${esc(v.s[3])}</div></div>`;
  const badge=`<div class="badges"><span class="badge">${v.t==="na"?"な형용사":"い형용사"}</span>${v.exc?`<span class="badge exc">주의</span>`:""}</div>`;
  const note=v.note?`<div class="tip">${ICON_INFO}<span>${jpWrap(v.note)}</span></div>`:"";
  resultShell(v,verdict,cls,badge+full+buildHTML(adjBuild(v,t),AFNAME[t],adjRule(v,t))+wrongX+note);
}
function nextQ(){ quiz.i++; if(quiz.i>=quiz.qs.length) quiz.stage="end"; render(); window.scrollTo({top:0}); }
function renderEnd(){
  const tot=quiz.qs.length, score=quiz.res.filter(Boolean).length;
  const wrong=quiz.qs.filter((q,k)=>!quiz.res[k]);
  const sent=quiz.mode==="sent";
  const pErr=sent?quiz.qs.filter(q=>byId[q.id].k==="v"&&q.po[q.p]!==byId[q.id].s[1]).length:0;
  const fErr=sent?quiz.qs.filter(q=>byId[q.id].k==="a"&&q.fo[q.v]!==byId[q.id].s[1]).length:0;
  const rErr=sent?quiz.qs.filter(q=>byId[q.id].k==="n"&&q.fo[q.v]!==byId[q.id].r).length:0;
  const tag=(q,v)=>{ if(!sent) return KIND[v.k];
    if(v.k==="n"){ const aB=q.ao[q.p]!==q.id, fB=q.fo[q.v]!==v.r; return aB&&fB?v.lab+"·"+(v.w===v.r?"표기":"읽기"):(aB?v.lab:(v.w===v.r?"표기":"읽기")); }
    if(v.k==="a"){ const aB=q.ao[q.p]!==q.id, fB=q.fo[q.v]!==v.s[1]; return aB&&fB?"형용사·형태":(aB?"형용사":"형태 "+AFNAME[v.s[1]]); }
    const pB=q.po[q.p]!==v.s[1], vB=q.vo[q.v]!==q.id; return pB&&vB?"조사·동사":(pB?"조사 "+v.s[1]:"동사"); };
  $("#view").innerHTML=`<div class="stack fade">
    <div class="card pad stack" style="align-items:center;text-align:center;gap:6px;padding:24px 16px">
      <span class="lbl">테스트 완료</span><div class="score">${score}/${tot}</div>
      <span style="color:var(--muted)">${score===tot?"모두 맞혔습니다.":"틀린 단어는 오늘 복습 목록에 다시 나옵니다."}${pErr?` 조사 실수 ${pErr}개.`:""}${fErr?` 형태 실수 ${fErr}개.`:""}${rErr?` 읽기 실수 ${rErr}개.`:""}</span>
    </div>
    ${wrong.length?`<div class="stack" style="gap:8px"><span style="font-size:15px;font-weight:600">틀린 문제</span><div class="mist">${wrong.map(q=>{const v=byId[q.id];
      return `<button data-id="${v.id}"><img src="${th(v.id)}" alt=""><span><span class="jp">${v.w}</span> <span class="jp" style="color:var(--muted);font-size:13px">${v.r}</span><br><span style="font-size:13px">${esc(v.ko)}</span></span><span class="tag">${tag(q,v)}</span></button>`;}).join("")}</div></div>`:""}
    <div class="rbtns">${wrong.length?`<button class="btn ghost" id="eRetry">틀린 것만</button>`:`<button class="btn ghost" id="eHome">홈으로</button>`}<button class="btn" id="eAgain">새 테스트</button></div>
    ${quiz.lesson!=null?`<button class="btn ghost" id="eLes">레슨 ${quiz.lesson+1} · ${esc(UNITS[quiz.lesson][0])}(으)로</button>`:""}
    ${wrong.length?`<button class="btn ghost" id="eHome">홈으로</button>`:""}
  </div>`;
  document.querySelectorAll(".mist button").forEach(b=>b.onclick=()=>openSheet(+b.dataset.id));
  const r=document.getElementById("eRetry"); if(r) r.onclick=()=>{const L=quiz.lesson; startQuiz(shuffle(wrong.map(q=>q.id)),quiz.mode); quiz.lesson=L;};
  $("#eAgain").onclick=()=>{quiz={stage:"setup"}; render();};
  const eL=document.getElementById("eLes"); if(eL) eL.onclick=()=>{lessonOpen=quiz.lesson; quiz={stage:"setup"}; go("lessons");};
  $("#eHome").onclick=()=>{quiz={stage:"setup"}; go("home");};
}
document.addEventListener("keydown",e=>{
  if(!$("#sheet").hidden){ if(e.key==="Escape") closeSheet(); return; }
  if(tab!=="quiz"||quiz.stage!=="run"||e.target.matches("input,select,textarea")) return;
  const q=quiz.qs[quiz.i], sent=quiz.mode==="sent";
  if(["1","2","3","4"].includes(e.key)){ const k=+e.key-1; if(sent&&q.p===null) pickP(k); else if(q.v===null) pickV(k); }
  else if((e.key==="Enter"||e.code==="Space")&&q.v!==null){ e.preventDefault(); nextQ(); }
});

// ---------- list ----------
const listState={q:"",f:"all",v:"w"};
const segHTML=()=>`<div class="seg" role="group"><button data-seg="w" aria-pressed="${listState.v==="w"}">단어 ${ALL.length}</button><button data-seg="p" aria-pressed="${listState.v==="p"}">헷갈리는 짝</button></div>`;
function segBind(){ document.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{listState.v=b.dataset.seg; renderList(); window.scrollTo({top:0});}); }
function renderList(){
  if(listState.v==="p") return renderPairs();
  const fl=[["all","전체"],["v","동사"],["a","형용사"],["L","레슨별"],["n","명사"],["e","표현·부사"],["ai","い형용사"],["an","な형용사"],["g1","1그룹"],["g2","2그룹"],["g3","3그룹"],["exc","예외·주의"],["todo","아직 못 외움"]];
  $("#view").innerHTML=`<div class="stack fade"><h1 class="h-title">단어</h1>${segHTML()}
    <input type="search" id="lq" placeholder="검색: 食べる, たべる, taberu, 먹다, 학교" value="${esc(listState.q)}" aria-label="단어 검색">
    <div class="row">${fl.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${listState.f===k}">${l}</button>`).join("")}</div>
    ${(listState.f==="L"||listState.f.startsWith("L:"))?`<div class="row">${UNITS.map((u,i)=>`<button class="chip" data-f="L:${i}" aria-pressed="${listState.f==="L:"+i}">${i+1}. ${esc(u[0])}</button>`).join("")}</div>`:""}
    ${(listState.f==="n"||listState.f==="e"||listState.f.startsWith("t:"))?`<div class="row">${NTOPICS.map((t,i)=>`<button class="chip" data-f="t:${i}" aria-pressed="${listState.f==="t:"+i}">${t}</button>`).join("")}</div>`:""}
    <div class="grid" id="grid"></div></div>`;
  segBind();
  const lq=$("#lq"); lq.oninput=()=>{listState.q=lq.value; fillGrid();};
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{listState.f=b.dataset.f; renderList();});
  fillGrid();
}
function fillGrid(){
  const g=$("#grid"); if(!g) return; const q=listState.q.trim().toLowerCase(), f=listState.f;
  const items=ALL.filter(v=>{ if(f.startsWith("L:")&&UNIT_OF[v.id]!==+f.slice(2))return false; if(f==="n"&&!(v.k==="n"&&v.lab==="명사"))return false; if(f==="e"&&!(v.k==="n"&&v.lab!=="명사"))return false; if(f.startsWith("t:")&&!(v.k==="n"&&v.tp===+f.slice(2)))return false; if(f==="v"&&v.k!=="v")return false; if(f==="a"&&v.k!=="a")return false; if(f==="ai"&&!(v.k==="a"&&v.t==="i"))return false; if(f==="an"&&!(v.k==="a"&&v.t==="na"))return false;
    if(f==="g1"&&!(v.k==="v"&&v.g===1))return false; if(f==="g2"&&!(v.k==="v"&&v.g===2))return false; if(f==="g3"&&!(v.k==="v"&&v.g===3))return false; if(f==="exc"&&!v.exc)return false; if(f==="todo"&&status(v.id)===2)return false;
    return !q||[v.w,v.r,v.ro,v.ko].some(x=>x.toLowerCase().includes(q)); });
  g.innerHTML=items.length?items.map(v=>`<button class="tile" data-id="${v.id}"><div class="ti"><img src="${th(v.id)}" alt="" loading="lazy"></div><div class="tt"><div class="tw"><span class="dot s${status(v.id)}"></span><span>${fu(v.w)}</span><span class="num">${v.k==="a"?"형":(v.k==="n"?v.lab[0]:"")}${v.n}</span></div><div class="tm">${esc(v.ko)}</div></div></button>`).join("")
    :`<div class="empty" style="grid-column:1/-1">찾는 단어가 없습니다. 히라가나, 로마자, 한국어 뜻으로 검색해 보세요.</div>`;
  g.querySelectorAll(".tile").forEach(b=>b.onclick=()=>openSheet(+b.dataset.id));
}

// ---------- pairs ----------
function renderPairs(){
  const side=v=>`<button class="side" data-id="${v.id}"><img src="${th(v.id)}" alt="" loading="lazy"><div class="w">${v.w}</div><div class="m">${esc(v.ko)}</div></button>`;
  const card=(a,b,t)=>`<div class="card pad pair"><div class="two">${side(byId[a])}${side(byId[b])}</div><p>${t||`<span class=jp>${byId[a].w}</span> ${esc(byId[a].ko)} ↔ <span class=jp>${byId[b].w}</span> ${esc(byId[b].ko)}`}</p></div>`;
  $("#view").innerHTML=`<div class="stack fade"><h1 class="h-title">단어</h1>${segHTML()}<div class="lbl">그림을 누르면 카드가 열립니다.</div>
    <h2 style="font-size:16px;margin:8px 0 0">동사 ${PAIRS.length}</h2>${PAIRS.map(([a,b,t])=>card(a,b,t)).join("")}
    <h2 style="font-size:16px;margin:12px 0 0">형용사 반대말 ${APAIRS.length}</h2>${APAIRS.map(([a,b,t])=>card(a,b,t)).join("")}
    ${NPAIRS.length?`<h2 style="font-size:16px;margin:12px 0 0">명사 짝 ${NPAIRS.length}</h2>${NPAIRS.map(([a,b,t])=>card(a,b,t)).join("")}`:""}</div>`;
  segBind();
  document.querySelectorAll(".pair .side").forEach(b=>b.onclick=()=>openSheet(+b.dataset.id));
}

// ---------- lessons ----------
const UNIT_OF={}; UNITS.forEach((u,i)=>u[2].forEach(id=>{UNIT_OF[id]=i;}));
let lessonOpen=null;
function unitStats(i){ const c=[0,0,0,0]; UNITS[i][2].forEach(id=>c[status(id)]++); return c; }
function nextUnit(){ for(let i=0;i<UNITS.length;i++){ const c=unitStats(i); if(c[2]<UNITS[i][2].length) return i; } return 0; }
function lessonPick(i,n){
  const ids=UNITS[i][2], now=Date.now();
  const due=ids.filter(id=>{const c=st(id); return c.s>0&&c.d<=now&&status(id)!==2;});
  const fresh=ids.filter(id=>st(id).s===0);
  const rest=ids.filter(id=>!due.includes(id)&&!fresh.includes(id));
  return shuffle(due).concat(fresh, shuffle(rest)).slice(0,n);
}
const KORD={v:0,a:1,n:2};
function kindLabel(v){ return v.k==="n"?v.lab:KIND[v.k]; }
function barHTML(c,tot){ const a=c[2]/tot*100, b=(c[1]+c[3])/tot*100; return `<div class="lbar"><i style="width:${a}%;background:var(--lv3)"></i><i style="width:${b}%;background:var(--lv2)"></i></div>`; }
function renderLessons(){
  if(lessonOpen!==null) return renderLesson(lessonOpen);
  const nu=nextUnit();
  $("#view").innerHTML=`<div class="stack fade"><h1 class="h-title">레슨</h1>
    <div class="lbl">주제별로 동사·형용사·명사·표현을 함께 배웁니다. 위에서부터 순서대로 하면 좋습니다.</div>
    <div class="stack" style="gap:8px">${UNITS.map((u,i)=>{ const c=unitStats(i), tot=u[2].length, done=c[2]===tot;
      return `<button class="lesson${i===nu?" next":""}" data-u="${i}"><span class="ln${done?" done":""}">${done?"✓":i+1}</span><span class="lt"><b>${esc(u[0])}</b><small>${esc(u[1])} · ${tot}단어</small>${barHTML(c,tot)}</span><span class="lc">${c[2]}/${tot}</span></button>`;}).join("")}</div></div>`;
  document.querySelectorAll(".lesson").forEach(b=>b.onclick=()=>{lessonOpen=+b.dataset.u; render(); window.scrollTo({top:0});});
}
function renderLesson(i){
  const u=UNITS[i], ids=u[2], c=unitStats(i), tot=ids.length;
  const words=ids.map(id=>byId[id]).sort((a,b)=>(KORD[a.k]-KORD[b.k])||(a.k==="n"&&b.k==="n"?(a.lab===b.lab?0:(a.lab==="명사"?-1:1)):0));
  const groups=[]; words.forEach(v=>{ const L=kindLabel(v); let g=groups.find(x=>x[0]===L); if(!g){g=[L,[]]; groups.push(g);} g[1].push(v); });
  const tile=v=>`<button class="tile" data-id="${v.id}"><div class="ti"><img src="${th(v.id)}" alt="" loading="lazy"></div><div class="tt"><div class="tw"><span class="dot s${status(v.id)}"></span><span>${fu(v.w)}</span></div><div class="tm">${esc(v.ko)}</div></div></button>`;
  $("#view").innerHTML=`<div class="stack fade">
    <div class="top"><button class="iconbtn" id="lBack" aria-label="레슨 목록"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><span class="lbl">레슨 ${i+1} / ${UNITS.length}</span></div>
    <div><h1 class="h-title">${esc(u[0])}</h1><div class="lbl">${esc(u[1])} · ${tot}단어</div></div>
    <div class="card pad stack" style="gap:10px">${barHTML(c,tot)}
      <div class="legend"><span><i style="background:var(--lv3)"></i>외움 ${c[2]}</span><span><i style="background:var(--lv2)"></i>학습 중 ${c[1]+c[3]}</span><span><i style="background:var(--empty)"></i>새 단어 ${c[0]}</span></div>
      <button class="btn" id="lGo">문장 테스트 ${Math.min(10,tot)}문제</button>
      <div class="rbtns"><button class="btn ghost" id="lAll">전체 ${tot}문제</button><button class="btn ghost" id="lPic">그림만 ${Math.min(10,tot)}문제</button></div>
    </div>
    ${groups.map(([L,vs])=>`<h2 style="font-size:16px;margin:6px 0 0">${L} ${vs.length}</h2><div class="grid">${vs.map(tile).join("")}</div>`).join("")}
    <div class="rbtns">${i>0?`<button class="btn ghost" id="lPrev">← ${esc(UNITS[i-1][0])}</button>`:"<span></span>"}${i<UNITS.length-1?`<button class="btn ghost" id="lNext">${esc(UNITS[i+1][0])} →</button>`:""}</div>
  </div>`;
  $("#lBack").onclick=()=>{lessonOpen=null; render(); window.scrollTo({top:0});};
  $("#lGo").onclick=()=>{startQuiz(lessonPick(i,10),"sent"); quiz.lesson=i;};
  $("#lAll").onclick=()=>{startQuiz(shuffle(ids.slice()),"sent"); quiz.lesson=i;};
  $("#lPic").onclick=()=>{startQuiz(lessonPick(i,10),"pic"); quiz.lesson=i;};
  const p=document.getElementById("lPrev"); if(p) p.onclick=()=>{lessonOpen=i-1; render(); window.scrollTo({top:0});};
  const nx=document.getElementById("lNext"); if(nx) nx.onclick=()=>{lessonOpen=i+1; render(); window.scrollTo({top:0});};
  document.querySelectorAll(".grid .tile").forEach(b=>b.onclick=()=>openSheet(+b.dataset.id));
}

// ---------- sheet ----------
let lastFocus=null;
function openSheet(id){
  const v=byId[id], c=st(id), s=status(id);
  const stTxt=["아직 학습하지 않음","학습 중","외운 단어","자주 틀림"][s];
  lastFocus=document.activeElement; const sh=$("#sheet");
  const badge = v.k==="n" ? `<span class="badge">${NTOPICS[v.tp]}</span>` : v.k==="a" ? `<span class="badge">${v.t==="na"?"な형용사":"い형용사"}</span>${v.exc?`<span class="badge exc">주의</span>`:""}` : `<span class="badge">${groupLabel(v)}</span>${v.exc?`<span class="badge exc">예외</span>`:""}`;
  sh.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-label="${v.w}"><div class="close"><button id="shClose">닫기</button></div>
    <div class="pic"><img src="${pic(id)}" alt="${v.w}" style="aspect-ratio:${AR[id]||1.45}"></div>
    <div class="pad stack">
      <div class="vhead"><span class="w jp" style="font-family:var(--f-jp);font-size:40px;font-weight:700">${v.w}</span><span class="r">${v.r} · ${v.ro}</span><span class="m">${esc(v.ko)}</span></div>
      <div class="badges">${badge}<span class="badge">레슨 ${UNIT_OF[id]+1} · ${esc(UNITS[UNIT_OF[id]][0])}</span></div>
      ${formsHTML(v)}
      <div class="full stack" style="gap:2px"><div class="s">${sentenceFull(v,false)}</div><div class="lbl">${esc(koOf(v))}</div></div>
      ${v.note?`<div class="tip">${ICON_INFO}<span>${jpWrap(v.note)}</span></div>`:""}
      <div class="lbl" style="text-align:center">${stTxt}${c.s?` · 학습 ${c.s}회, 틀림 ${c.w||0}회${v.k==="v"?`, 조사 실수 ${c.pw||0}회`:""}`:""}</div>
    </div></div>`;
  sh.hidden=false; document.body.style.overflow="hidden";
  $("#shClose").focus(); $("#shClose").onclick=closeSheet; sh.onclick=e=>{if(e.target===sh) closeSheet();};
}
function closeSheet(){const sh=$("#sheet"); sh.hidden=true; sh.innerHTML=""; document.body.style.overflow=""; if(lastFocus&&lastFocus.focus) lastFocus.focus();}

// ---------- reset ----------
$("#resetBtn").onclick=()=>{
  $("#resetBox").innerHTML=`<div class="confirm">학습 기록과 연속 일수를 모두 지울까요?<button class="y" id="rY">지우기</button><button class="n" id="rN">취소</button></div>`;
  $("#rN").onclick=()=>{$("#resetBox").innerHTML="";};
  $("#rY").onclick=()=>{prog={v:2,cards:{},days:{}}; save(); $("#resetBox").innerHTML=""; render();};
};
render();
if("serviceWorker" in navigator && location.protocol!=="file:"){
  navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{ const el=document.getElementById("sync"); if(el) el.textContent="오프라인 사용 준비 완료 · 기록은 이 기기에 저장됩니다"; }).catch(()=>{});
}
